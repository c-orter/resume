name: Build and Deploy
on: [push]

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Bun 🥟
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary # `bun lint` hasn't reached a stable release yet; switch to latest once it has.

      # Astro runs on Node (`astro check`, `astro build`); the runner's preinstalled Node can be older than it requires.
      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install 📦
        run: bun install --frozen-lockfile

      - name: Format and lint 🧹
        run: |
          bun fmt --check
          bun lint
          bun run check

      - name: Build 🔧
        run: bun run build

      - name: Install browser for print tests 🌐
        run: |
          sudo apt-get install -y poppler-utils
          bunx playwright install --with-deps chromium

      - name: Print tests 🖨️
        run: bun test tests/print.test.ts

      - name: Upload print output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-output
          path: test-results

      - name: Deploy 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
